<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG Image - Book Now</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #14110F;
    position: relative;
    color: #F6EFE6;
  }

  .glow {
    position: absolute;
    top: -100px;
    right: -80px;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: rgba(196, 154, 91, 0.28);
    filter: blur(90px);
  }

  .glow-2 {
    position: absolute;
    bottom: -120px;
    left: -80px;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: rgba(196, 154, 91, 0.12);
    filter: blur(100px);
  }

  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(246, 239, 230, 0.18);
    border-radius: 24px;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 80px;
  }

  .eyebrow {
    font-size: 16px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #D8B27C;
    font-weight: 500;
    margin-bottom: 18px;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 52px;
    line-height: 1.15;
    color: #F6EFE6;
    font-weight: 500;
  }

  .price-badge {
    margin-top: 32px;
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 18px 40px;
    border: 1px solid rgba(196, 154, 91, 0.4);
    background: rgba(255, 255, 255, 0.04);
    border-radius: 20px;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-size: 64px;
    font-weight: 500;
    color: #D8B27C;
  }

  .price-unit {
    font-size: 16px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(246, 239, 230, 0.5);
  }

  .subtext {
    margin-top: 24px;
    font-size: 20px;
    color: rgba(246, 239, 230, 0.65);
  }

  .divider {
    width: 64px;
    height: 2px;
    background: #C49A5B;
    margin: 26px auto;
  }

  .hotel-row {
    margin-top: 4px;
    display: flex;
    gap: 24px;
    font-size: 16px;
    color: rgba(246, 239, 230, 0.5);
    letter-spacing: 0.02em;
  }

  .hotel-row span::before {
    content: "•";
    margin-right: 24px;
    color: #C49A5B;
  }

  .hotel-row span:first-child::before {
    content: "";
    margin-right: 0;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="eyebrow">Hotel Spa Therapy</div>
    <div class="headline">Book a Therapy Expert</div>

    <div class="price-badge">
      <span class="price">₹11,999</span>
      <span class="price-unit">/ session</span>
    </div>

    <p class="subtext">Facility available at select 5-star hotels in Delhi NCR</p>

    <div class="divider"></div>

    <div class="hotel-row">
      <span>Aerocity</span>
      <span>Connaught Place</span>
      <span>Dwarka</span>
      <span>NFC</span>
      <span>Chanakyapuri</span>
    </div>
  </div>
</body>
</html>
