<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG Image Template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #14110F; /* ink */
    position: relative;
    color: #F6EFE6; /* cream */
  }

  /* soft glow accent, like the hero section */
  .glow {
    position: absolute;
    top: -120px;
    right: -100px;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: rgba(196, 154, 91, 0.28); /* brass tint */
    filter: blur(90px);
  }

  .glow-2 {
    position: absolute;
    bottom: -140px;
    left: -100px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(196, 154, 91, 0.12);
    filter: blur(100px);
  }

  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(246, 239, 230, 0.18);
    border-radius: 24px;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 90px;
  }

  .eyebrow {
    font-size: 15px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #D8B27C; /* brass-light */
    font-weight: 500;
    margin-bottom: 22px;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 68px;
    line-height: 1.1;
    color: #F6EFE6;
    font-weight: 500;
  }

  .brand .accent {
    font-style: normal;
    color: #D8B27C;
  }

  .tagline {
    margin-top: 22px;
    font-size: 20px;
    color: rgba(246, 239, 230, 0.65);
    font-weight: 400;
    max-width: 640px;
  }

  .divider {
    width: 64px;
    height: 2px;
    background: #C49A5B;
    margin: 28px auto;
  }

  .footer-row {
    margin-top: 6px;
    display: flex;
    gap: 28px;
    font-size: 16px;
    color: rgba(246, 239, 230, 0.55);
    letter-spacing: 0.02em;
  }

  .footer-row span::before {
    content: "•";
    margin-right: 28px;
    color: #C49A5B;
  }

  .footer-row span:first-child::before {
    content: "";
    margin-right: 0;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="eyebrow">Delhi NCR's Trusted Spa Brand</div>
    <div class="brand">Neha <span class="accent">Luxury</span> Body Spa</div>
    <div class="divider"></div>
    <div class="tagline">Premium body massage, couple spa &amp; wellness rituals across Delhi NCR</div>
    <div class="footer-row">
      <span>7+ Branches</span>
      <span>Expert Therapists</span>
      <span>Book Today</span>
    </div>
  </div>
</body>
</html>
