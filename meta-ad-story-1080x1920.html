<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Meta Ad Creative - Story 1080x1920</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: #14110F;
    position: relative;
    color: #F6EFE6;
  }

  /* Safe zone note: keep key content within top 250px - bottom 250px margins
     to avoid Stories UI overlap (profile pic top, reply bar bottom) */

  .glow {
    position: absolute;
    top: -160px;
    right: -120px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: rgba(196, 154, 91, 0.30);
    filter: blur(120px);
  }

  .glow-2 {
    position: absolute;
    bottom: -200px;
    left: -140px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: rgba(196, 154, 91, 0.14);
    filter: blur(130px);
  }

  .frame {
    position: absolute;
    inset: 36px;
    border: 1px solid rgba(246, 239, 230, 0.18);
    border-radius: 32px;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 260px 90px 280px;
  }

  .eyebrow {
    font-size: 22px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #D8B27C;
    font-weight: 600;
    margin-bottom: 32px;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 72px;
    line-height: 1.2;
    color: #F6EFE6;
    font-weight: 500;
  }

  .price-badge {
    margin-top: 60px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 36px 64px;
    border: 1.5px solid rgba(196, 154, 91, 0.45);
    background: rgba(255, 255, 255, 0.04);
    border-radius: 26px;
  }

  .price {
    font-family: 'Fraunces', serif;
    font-size: 92px;
    font-weight: 500;
    color: #D8B27C;
    line-height: 1;
  }

  .price-unit {
    font-size: 20px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(246, 239, 230, 0.5);
  }

  .subtext {
    margin-top: 44px;
    font-size: 27px;
    color: rgba(246, 239, 230, 0.7);
    max-width: 660px;
    line-height: 1.55;
  }

  .divider {
    width: 80px;
    height: 2px;
    background: #C49A5B;
    margin: 52px auto;
  }

  .locations {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px 32px;
    max-width: 720px;
    font-size: 21px;
    color: rgba(246, 239, 230, 0.55);
  }

  .locations span {
    position: relative;
    padding-left: 24px;
  }

  .locations span::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C49A5B;
  }

  .locations span:first-child {
    padding-left: 0;
  }
  .locations span:first-child::before {
    display: none;
  }

  .cta-bar {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    background: #C49A5B;
    color: #14110F;
    font-weight: 700;
    font-size: 26px;
    padding: 22px 64px;
    border-radius: 100px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="eyebrow">Hotel Spa Therapy</div>
    <div class="headline">Book a Therapy<br/>Expert</div>

    <div class="price-badge">
      <span class="price">₹11,999</span>
      <span class="price-unit">/ session</span>
    </div>

    <p class="subtext">Certified therapist at your 5-star hotel room — no travel needed</p>

    <div class="divider"></div>

    <div class="locations">
      <span>Aerocity</span>
      <span>Connaught Place</span>
      <span>Mahipalpur</span>
      <span>NFC</span>
      <span>Chanakyapuri</span>
    </div>
  </div>

  <div class="cta-bar">Call or WhatsApp to Book</div>
</body>
</html>
